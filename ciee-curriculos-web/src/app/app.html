<div class="min-h-screen flex flex-col bg-[#f8fafc] text-slate-900 font-sans">
  <!-- Barra de Navegação Global Institucional CIEE -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <!-- Logo Oficial CIEE e Identificação -->
        <div class="flex items-center space-x-4">
          <a routerLink="/" class="flex items-center gap-2 group transition" title="Página Inicial - CIEE">
            <img src="https://kairosdoc.s3.us-east-1.amazonaws.com/imagens/logo/logo-CIEE-azul.svg" alt="Logotipo CIEE" class="h-9 w-auto object-contain transition group-hover:opacity-90" />
            <div class="hidden sm:block border-l border-slate-200 pl-3">
              <span class="text-xs font-bold text-[#003087] tracking-wider uppercase block">Triagem de Talentos</span>
              <span class="text-[11px] text-slate-500 block">Gestão de Currículos</span>
            </div>
          </a>
        </div>

        <!-- Links de Navegação -->
        <nav class="flex items-center space-x-3">
          <a 
            routerLink="/" 
            routerLinkActive="bg-[#e8f1fb] text-[#003087] font-bold" 
            [routerLinkActiveOptions]="{ exact: true }"
            class="text-sm font-semibold text-slate-700 hover:text-[#003087] hover:bg-slate-100 px-3.5 py-2 rounded-lg transition outline-none focus:outline-none focus:ring-0 focus-visible:ring-0">
            Candidatos
          </a>
          <a 
            routerLink="/cadastro" 
            routerLinkActive="bg-[#d65f04]"
            class="inline-flex items-center gap-2 text-sm font-bold text-white bg-[#ed6b06] hover:bg-[#d65f04] active:bg-[#c64f01] px-4 py-2 rounded-lg transition shadow-xs outline-none focus:outline-none focus-visible:outline-none ring-0 focus:ring-0 focus-visible:ring-0">
            <svg class="w-4 h-4 stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/>
            </svg>
            <span>Novo Candidato</span>
          </a>
        </nav>
      </div>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="flex-grow">
    <router-outlet></router-outlet>
  </main>

  <!-- Rodapé Institucional CIEE -->
  <footer class="bg-white border-t border-slate-200 py-6 mt-12">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-slate-500">
      <div class="flex items-center gap-2">
        <img src="https://kairosdoc.s3.us-east-1.amazonaws.com/imagens/logo/logo-CIEE-azul.svg" alt="CIEE" class="h-5 w-auto grayscale opacity-70" />
        <span>Centro de Integração Empresa-Escola — CIEE</span>
      </div>
      <div>
        Sistema de Cadastro e Triagem Inteligente de Currículos
      </div>
    </div>
  </footer>
</div>
